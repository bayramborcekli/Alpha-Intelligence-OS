name: Project governance and regression

on:
  push:
  pull_request:

jobs:
  direction-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked test runner
        run: python -m pip install -r requirements-dev.txt
      - name: Validate active project contract
        run: python scripts/project_preflight.py --check
      - name: Run governance tests
        run: python -m pytest -q tests/test_project_governance.py

  full-regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install application and locked test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q alpha20_v1 app.py serve_windows.py
      - name: Run full regression
        run: python -m pytest -q
      - name: Validate patches
        run: git diff --check
